<title>Kids Calendar Game</title>
<style>
@font-face {
  font-family: 'Atkinson Hyperlegible';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/AtkinsonHyperlegible-0.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Atkinson Hyperlegible';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url(fonts/AtkinsonHyperlegible-1.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

  font-family: 'Baloo 2';
  font-style: normal;

  font-display: swap;
  src: url(fonts/Baloo2-2.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Baloo 2';
  font-style: normal;
  font-weight: 800;
  font-display: swap;
  src: url(fonts/Baloo2-2.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
</style>
<style>
/* Layout: one fixed frame every month (picture band, content, three big tabs). Only the colors and pictures change, so the app stays predictable. */
:root{
  --bg:#FBF0DD;--ink:#4A2A0E;--card:#FFFFFF;--line:#EBD3AE;--skyA:#E7A04A;--skyB:#F7D49B;--bannerInk:#4A2A0E;--ground:#B5651D;--accent:#A8451A;--onAccent:#FFFFFF;
  --display:"Baloo 2",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-rounded,system-ui,-apple-system,sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
html,body{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.3;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:background-color .25s}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{height:100%;display:flex;flex-direction:column}

/* Picture band */
.scene{position:relative;flex:none;height:clamp(60px,10vh,104px);background:linear-gradient(var(--skyA),var(--skyB));overflow:hidden}
.scene span{position:absolute;line-height:1}
.scene svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:34%;display:block}
.scene path{fill:var(--ground)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Tabs */
nav{flex:none;display:flex;gap:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:8px 10px;background:var(--card);border-top:2px solid var(--line)}
nav button{flex:1;min-width:0;height:66px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1}
nav button i{font-style:normal;font-size:26px;line-height:1.1}
nav button.home:not(.on){border:3px solid var(--accent);color:var(--accent)}
nav button.on{background:var(--accent);color:var(--onAccent)}
#vol{flex:none;display:flex;align-items:center;gap:10px;background:var(--card);border-top:2px solid var(--line);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:5px}
#vol button{flex:none;min-height:44px;padding:2px 12px;border-radius:12px;border:2px solid var(--line);font-family:var(--display);font-weight:600;font-size:18px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#vol button.off{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
#vol label{flex:none;font-weight:700;font-size:16px}
#volRange{flex:1;min-width:60px;height:44px;margin:0;accent-color:var(--accent);touch-action:none}

/* Shared controls */
.btn{min-height:64px;padding:8px 28px;border-radius:18px;background:var(--accent);color:var(--onAccent);font-family:var(--display);font-weight:600;font-size:26px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:12px}
.ask{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.2vw,44px);line-height:1.12;text-wrap:balance}
.note{font-size:18px}
.say{flex:none;width:56px;height:56px;border-radius:50%;background:var(--card);border:3px solid var(--line);font-size:24px;display:flex;align-items:center;justify-content:center}

/* Calendar */
.calwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.cal{flex:1 0 auto;display:flex;flex-direction:column;gap:6px}
.mrow{flex:none;display:flex;align-items:center;gap:10px}
.mrow .arrow{flex:none;width:72px;height:64px;border-radius:18px;background:var(--accent);color:var(--onAccent);font-size:30px;font-weight:700}
.mtitle{flex:1;min-width:0;text-align:center}
.mtitle h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.4vw,54px);line-height:1}
.mtitle p{font-size:17px}
.dow{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center;font-weight:700;font-size:18px}
.grid{flex:1 0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cell{min-width:0;min-height:0;border-radius:12px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;padding:3px 6px;overflow:hidden;text-align:left}
.blank{background:none;border:0}
.cell .n{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,28px);line-height:1.15}
.cell .top{display:flex;justify-content:space-between;align-items:center;width:100%;min-width:0}
.cell .ic{font-size:clamp(14px,2.6vw,20px);line-height:1;white-space:nowrap}
.cell .ev{display:flex;flex-direction:column;width:100%;min-width:0}
.cell .ev{margin-right:-3px}
.cell .ev b{font-size:12px;letter-spacing:-.1px;line-height:1.15;font-weight:700;overflow:hidden;overflow-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.cell.today{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--card),0 0 0 3px var(--ink);border-color:var(--ink)}

/* Selected day */
.day{flex:none;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.leaf{flex:none;width:84px;border-radius:12px;overflow:hidden;text-align:center;border:2px solid var(--accent);background:var(--card)}
.leaf small{display:block;background:var(--accent);color:var(--onAccent);font-weight:700;font-size:16px;letter-spacing:.08em;padding:2px 0}
.leaf b{display:block;font-family:var(--display);font-weight:800;font-size:44px;line-height:1.15}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dinfo h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.dinfo .sub{font-size:19px}
.dinfo .meta{font-size:16px}
.evrow{font-size:20px;font-weight:700;margin-top:3px}
.dside{flex:none;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.small{min-height:48px;padding:4px 16px;font-size:20px;border-radius:14px}

/* Question screens */
.q{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;max-width:760px;width:100%;margin-inline:auto;padding-block:6px}
.qhead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.count{font-size:18px;font-weight:700}
.chips,.months,.days,.opts{display:grid;gap:10px}
.chips{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.months{grid-template-columns:repeat(3,minmax(0,1fr))}
.days{grid-template-columns:repeat(7,minmax(0,1fr))}
.opts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{min-height:68px;border-radius:16px;background:var(--card);border:3px solid var(--line);font-family:var(--display);font-weight:600;font-size:24px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;min-width:0}
.tile.on{border-color:var(--accent);background:var(--accent);color:var(--onAccent)}
.tile.no{opacity:.32}
.tile.yes{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.field{width:100%;height:72px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--body);font-size:28px;padding:0 18px}
.err{min-height:24px;font-weight:700}

/* Birthday list */
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.1}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;min-height:76px}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--onAccent);font-family:var(--display);font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:24px;overflow-wrap:anywhere}
.pinfo span{font-size:18px}
.when{flex:none;text-align:right;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.05}
.when small{display:block;font-family:var(--body);font-size:15px;font-weight:400}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:20px}
.saved{margin-top:18px;font-size:15px}

/* Game */
.stars{display:flex;gap:8px}
.star{width:48px;height:48px;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1}
.star.got{border:3px solid var(--accent);background:var(--card)}
.gcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.gcal .dh{text-align:center;font-weight:700;font-size:17px}
.gday{height:clamp(46px,7.4vh,68px);border-radius:12px;background:var(--card);border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:26px}
.gday.no{opacity:.32}
.gday.yes{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.gday.hint{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent)}
.gmonth{font-family:var(--display);font-weight:800;font-size:28px;text-align:center}
.fb{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:22px;font-weight:700}
.book{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stk{background:var(--card);border:2px solid var(--line);border-radius:14px;text-align:center;padding:6px 2px;font-size:15px}
.stk i{display:block;font-style:normal;font-size:32px;line-height:1.2}
.stk.none i{filter:grayscale(1);opacity:.3}
.win{align-items:center;text-align:center;justify-content:center}
.big{font-size:96px;line-height:1.1;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.big{animation:none}body{transition:none}}

/* Drawn people and the driving game */
body{-webkit-touch-callout:none}
.fig{display:block;flex:none;width:84px;height:112px}
.fig.head{width:52px;height:52px}
.fig.huge{width:150px;height:200px}
.looks{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.lktile{flex-direction:column;gap:2px;padding:8px 4px;font-size:21px}
.dests{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.dest{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 14px;min-height:92px}
.dest i{font-style:normal;font-size:44px;line-height:1;flex:none}
.dest b{display:block;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.dest span span{font-size:17px}
.crew{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px}
.askcard{width:100%;background:var(--card);border:3px solid var(--accent);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.askcard p{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15}
#app.road .scene{display:none}
.rhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:20px}
.rhead b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;min-width:0}
.rhead span{flex:none;font-weight:700}
.rbar{flex:none;height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-block:6px}
.rbar i{display:block;height:100%;width:0;background:var(--accent)}
.roadbox{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden}
#road{position:absolute;inset:0;width:100%;height:100%;display:block}
.rctl{flex:none;display:flex;gap:10px;padding-top:10px}
.rctl button{height:104px;border-radius:20px;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;touch-action:none;background:var(--card);border:3px solid var(--line);padding:4px;min-width:0}
.rctl .side{flex:1}
#pedal{flex:2.2;background:#2E9E4F;border-color:#2E9E4F;color:#FFFFFF;font-size:44px}
#pedal.wait{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-size:32px}
#pedal.held{background:#C8403A;border-color:#C8403A}
#pedal.idle,#pedal.wait{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 7px var(--line)}}
.rhintrow{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;min-height:56px}
.rhint{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6vw,28px);line-height:1.1;text-align:center}

/* Polish */
button:active:not(:disabled){transform:scale(.97)}
button{transition:background-color .12s,transform .08s}
.enter{animation:rise .18s ease-out}
@keyframes rise{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.lktile{position:relative}
.lktile.on::after{content:"✓";position:absolute;top:6px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--accent);font-family:var(--body);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.opts .tile{min-height:96px;font-size:clamp(26px,4.6vw,36px)}
.prow::after{content:"›";flex:none;font-size:30px;line-height:1;opacity:.5}
.group{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.link{margin-top:10px;min-height:44px;font-size:17px;text-decoration:underline}
.grown{display:flex;flex-direction:column;gap:22px;max-width:640px;width:100%;margin-inline:auto;padding-block:6px}
.grown section{display:flex;flex-direction:column;gap:10px}
.area{height:190px;padding:12px 16px;font-size:22px;resize:none;-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){.enter,#pedal.idle,#pedal.wait{animation:none}button{transition:none}}

/* Pop-up friend */
#pop{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;pointer-events:none;animation:pop .3s ease-out}
#app.road #pop{bottom:auto;top:calc(136px + env(safe-area-inset-top,0px))}
#pop .say-it{position:relative;background:#FFFFFF;color:#1E1E24;border:3px solid #1E1E24;border-radius:18px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,32px);line-height:1.1;margin-bottom:58px;max-width:340px}
#pop .say-it::after{content:"";position:absolute;left:-13px;bottom:14px;border:7px solid transparent;border-right:13px solid #1E1E24;border-left:0}
@media (prefers-reduced-motion:reduce){#pop{animation:none}}

/* School */
.board{background:#1F4B3F;color:#F4F1E4;border:8px solid #8A5A32;border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.board b{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,38px);line-height:1.1}
.board span{font-size:20px}
.picrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:38px;line-height:1.1}
.picrow .sym{font-family:var(--display);font-weight:800;font-size:44px;padding-inline:10px}
.picrow .off{opacity:.22}
.coin{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;color:#2C2C33;border:3px solid #6E7178;background:#CDD0D6;width:62px;height:62px;font-size:18px}
.coin.c1{background:#D08A55;border-color:#8A5228;width:58px;height:58px}
.coin.c10{width:52px;height:52px;font-size:16px}
.coin.c25{width:78px;height:78px;font-size:21px}
.gday.static{display:flex;align-items:center;justify-content:center;height:clamp(34px,5vh,46px);font-size:20px;border-width:2px}
.levels{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}

/* Burger Stop */
.menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.menu .tile{flex-direction:column;gap:0;padding:10px 4px;line-height:1.15}
.menu .emo{font-size:46px;line-height:1.15}
.menu .price{font-weight:800;font-size:28px}
.bills{display:flex;gap:14px;flex-wrap:wrap}
.bill{width:170px;height:88px;border-radius:12px;background:#8CC98A;border:5px solid #3F7E45;color:#123A1B;font-family:var(--display);font-weight:800;font-size:40px}
.tray{font-size:34px;min-height:44px;line-height:1.2}
.msg{min-height:28px;font-weight:700;font-size:20px}

.opts .tile.long{font-size:clamp(20px,3.3vw,26px)}
.lktile span{max-width:100%;min-width:0;overflow-wrap:anywhere;text-align:center;line-height:1.1}
.dinfo h2{overflow-wrap:anywhere}
.dinfo .sub,.dinfo .meta,.evrow{overflow-wrap:break-word}
.dinfo .btn{align-self:flex-start;max-width:100%;margin-top:6px;text-align:left;line-height:1.1}
@media (max-height:720px){
  .rctl{padding-top:6px}
  .rctl button{height:70px}
  #pedal{font-size:36px}
  #pedal.wait{font-size:26px}
  .rhintrow{min-height:44px;margin-bottom:3px}
  .rhintrow .say{width:44px;height:44px}
  .rhint{font-size:22px}
}
@media (max-width:560px){
  .rhead{flex-wrap:wrap;gap:0 12px}
  .rhead b{flex:1 0 100%}
  .rhead span{font-size:17px}
  .dinfo h2{font-size:26px}
}

/* Wide landscape: day card moves beside the calendar */

let actx=null,master=null,musicBus=null;
function getAudio(){
  if(actx)return actx;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  actx=new AC();master=actx.createGain();musicBus=actx.createGain();
  musicBus.connect(master);master.connect(actx.destination);

  const len=Math.floor(actx.sampleRate*1.6),ir=actx.createBuffer(2,len,actx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}

const SAMPLE_SETS={
 piano:['A3','C4','Ds4','Fs4','A4','C5','Ds5','Fs5','A5','C6','Ds6','Fs6','A6'],
 strings:['C3','E3','Ab3','C4','E4','Ab4','C5','E5'],

const samples={ready:false,failed:false,sets:{}};
function noteMidi(n){
  const m=n.match(/^([A-G])([sb]?)(\d)$/),base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return (+m[3]+1)*12+base+(m[2]==='s'?1:m[2]==='b'?-1:0);
}
async function loadSamples(){
  const jobs=[];
  Object.entries(SAMPLE_SETS).forEach(([set,notes])=>{
    samples.sets[set]=[];
    notes.forEach(n=>jobs.push((async()=>{
      const r=await fetch(`audio/${set}/${n}.mp3`);
      if(!r.ok)throw new Error('missing');
      const ab=await r.arrayBuffer();
      const buf=await new Promise((ok,no)=>actx.decodeAudioData(ab,ok,no));
      samples.sets[set].push({midi:noteMidi(n),buf});
    })().catch(()=>{})));

function playSample(set,midi,t,dur,peak,attack){
  const list=samples.sets[set];let best=list[0];
  list.forEach(x=>{if(Math.abs(x.midi-midi)<Math.abs(best.midi-midi))best=x});
  const src=actx.createBufferSource(),v=actx.createGain(),rel=.18;
  src.buffer=best.buf;src.playbackRate.value=Math.pow(2,(midi-best.midi)/12);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(peak,t+attack);
  v.gain.setValueAtTime(peak,t+Math.max(attack,dur));v.gain.linearRampToValueAtTime(0,t+Math.max(attack,dur)+rel);
  src.connect(v);v.connect(musicBus);src.start(t);src.stop(t+Math.max(attack,dur)+rel+.02);

const degMidi=(s,d)=>{const i=d-1,oct=Math.floor(i/7),n=((i%7)+7)%7;return s.root+s.scale[n]+12*oct};

function musicStep(t){
  let s=mus.song;
  if(mus.step%s.bar===0){const want=wantedSong();if(want!==s){mus.song=want;mus.step=0;s=want}}
  const sec=60/s.bpm/2,i=mus.step%s.mel.length,pos=i%s.bar,root=s.chords[Math.floor(i/s.bar)%s.chords.length],ch=s.mel[i];
  const d=tokenDeg(ch);
  if(samples.ready){
    /* The same band plays every song: piano tune, warm strings, picked guitar, bass. */
    if(d!==null){
      let hold=1;while(s.mel[(i+hold)%s.mel.length]==='-'&&hold<s.mel.length)hold++;
      playSample('piano',degMidi(s,d),t,Math.max(sec*hold,.3),.34,.005);
    }
    const tone=n=>degMidi(s,root+n),arp=s.bar===6?[0,2,4]:[0,4,2,4];
    if(pos===0)[0,2,4].forEach(n=>playSample('strings',tone(n)-12,t,sec*s.bar,.11,.16));
    if(pos===0||pos===Math.floor(s.bar/2))playSample('bass',tone(pos?4:0)-24,t,sec*3,.34,.01);
    playSample('guitar',tone(arp[pos%arp.length])-12,t,sec*1.9,.12,.004);
    mus.step++;
    return sec;
  }
  if(d!==null&&ch!=='-'&&ch!=='.'){
    let hold=1;while(s.mel[(i+hold)%s.mel.length]==='-'&&hold<s.mel.length)hold++;
    musNote(degMidi(s,d)+12,t,sec*hold*.95+.18,s.wave,s.peak);

}

function setupRoad(){
  const x=dr.dest,t=nowD(),total=daysFromToday(x.y,x.m,x.d),marks=[];
  const plus=k=>{const a=new Date(t.y,t.m,t.d+k);marks.push({y:a.getFullYear(),m:a.getMonth(),d:a.getDate()})};
  if(total<=10){for(let k=1;k<=total;k++)plus(k)}
  else if(total<=70){for(let k=7;k<total;k+=7)plus(k);plus(total)}
  else{let y=t.y,m=t.m;for(;;){m++;if(m>11){m=0;y++}if(dayNum(y,m,1)>=dayNum(x.y,x.m,x.d))break;marks.push({y,m,d:1})}plus(total)}
  dr.picks=dr.picks.filter(id=>state.people.some(p=>p.id===id));
  const stops=dr.picks.map((id,i)=>({id,x:560+420*i,p:state.people.find(p=>p.id===id),done:false}));
  const months=[t.m];marks.forEach(m=>{if(m.m!==months[months.length-1])months.push(m.m)});
  const chosen=new Set(months.length<=4?months.map((_,i)=>i):[0,1,2,3].map(i=>Math.round(i*(months.length-1)/3)));
  let cx=stops.length?stops[stops.length-1].x+560:640,mi=0;
  stops.push({burger:true,x:cx,done:false});cx+=620;
  const funAt=m=>{stops.push({fun:true,m,tap:0,x:cx,done:false});cx+=620};
  if(chosen.has(0))funAt(t.m);
  marks.forEach(mk=>{
    const isNew=mk.m!==months[mi];
    mk.x=cx;cx+=520;
    if(isNew){mi++;if(chosen.has(mi))funAt(mk.m)}
  });
  const L=cx+40;
  const gifts=[];
  let i=0;for(let gx=420;gx<L-320;gx+=330,i++){if(!stops.some(s=>Math.abs(s.x-gx)<190))gifts.push({x:gx,lane:1,got:false})}
  const segs=[{x:-1e9,m:t.m}];marks.forEach(m=>{if(m.m!==segs[segs.length-1].m)segs.push({x:m.x,m:m.m})});
  Object.assign(dr,{step:'road',marks,stops,L,giftsOnRoad:gifts,segs,pass:[],did:[],gifts:0,spent:0,burger:null,x:0,v:0,go:false,lane:1,laneY:1,waiting:null,arrived:false,beep:0,passed:0});
}

    const have=(G===5?rint(10,50):rint(2,10))*100,cost=rint(1,have/25-1)*25,left=have-cost;
    return optionsQ(`You have ${fmt(have)}. The ${food[0]} costs ${fmt(cost)}. How much is left?`,left,`${fmt(have)} − ${fmt(cost)} = ${fmt(left)}.`,pic,3,fmt,25);
  }
  if(kind==='total'){
    const qty=rint(2,5),step=G===4?50:25,price=rint(1,8)*step,total=qty*price;
    return optionsQ(`You buy ${qty} of these. Each one costs ${fmt(price)}. What is the total?`,total,`${qty} × ${fmt(price)} = ${fmt(total)}.`,pic,3,fmt,step);
  }
  let coins=[];
  if(G===0){let c=rint(1,10);while(c--)coins.push(1)}
  else{
    const set=G===1?[10,5,1]:[25,10,5,1];
    set.forEach(v=>{let c=rint(0,v===1?4:G>=2?3:2);while(c--)coins.push(v)});
    if(!coins.length)coins.push(10,1);
  }
  const sum=coins.reduce((a,b)=>a+b,0),vis=`<div class="picrow">${coins.map(v=>`<span class="coin c${v}">${v}¢</span>`).join('')}</div>`;
  return optionsQ('How much money is this?',sum,`That is ${sum} ${sum===1?'cent':'cents'}.`,vis,G===0?3:5,n=>n+'¢');
 }
};

  return qs;
}

/* ---------- game ---------- */
function peopleThings(){return withBday().map(p=>{const o=nextOcc(p);return{p,label:poss(p)+' birthday',y:o.y,m:o.m,d:o.d}})}
function holidayThings(){
  const t=nowD(),out=[];
  [t.y,t.y+1].forEach(y=>holidays(y).forEach(h=>{const n=daysFromToday(y,h.m,h.d);if(n>=0&&n<365&&!h.nogame&&h.name.length<24)out.push({label:h.name,y,m:h.m,d:h.d})}));
  return out;
}
function buildRound(){
  const ppl=peopleThings(),hol=holidayThings();
  const canWho=ppl.some(a=>ppl.some(b=>b.m!==a.m||b.d!==a.d));
  let order=canWho?shuffle(['who','weekday','month','find']):shuffle(['weekday','month','find','weekday']);
  order=['find'].concat(order);
  const used=new Set();
  const choose=list=>{const fresh=list.filter(x=>!used.has(x));const x=pick(fresh.length?fresh:list);used.add(x);return x};
  return order.map(type=>{
    let th;
    if(type==='who'){th=choose(ppl.filter(a=>ppl.some(b=>b.m!==a.m||b.d!==a.d)))}
    else th=ppl.length&&(Math.random()<.75)?choose(ppl):choose(hol);
    const L=cap(th.label),date=`${MONTHS[th.m]} ${th.d}`,q={type,y:th.y,m:th.m,wrong:[],solved:false};
    if(type==='find'){q.text=`Tap ${th.label}.`;q.answer=th.d;q.fact=`${L} is ${date}.`}
    if(type==='weekday'){const w=DAYS[dow(th.y,th.m,th.d)];q.text=`What day of the week is ${th.label} in ${th.y}?`;q.answer=w;q.options=DAYS.map(x=>({v:x,t:x}));q.fact=`${L} is on a ${w} in ${th.y}.`}
    if(type==='month'){const others=shuffle(MONTHS.filter((_,i)=>i!==th.m)).slice(0,3);const set=others.concat(MONTHS[th.m]).sort((a,b)=>MONTHS.indexOf(a)-MONTHS.indexOf(b));q.text=`What month is ${th.label}?`;q.answer=MONTHS[th.m];q.options=set.map(x=>({v:x,t:x}));q.fact=`${L} is in ${MONTHS[th.m]}.`}
    if(type==='who'){const others=shuffle(ppl.filter(b=>b.m!==th.m||b.d!==th.d)).slice(0,3);q.text=`Whose birthday is ${date}?`;q.answer=th.p.id;q.options=shuffle(others.concat(th)).map(b=>({v:b.p.id,t:b.p.name}));q.fact=`${cap(poss(th.p))} birthday is ${date}.`}
    return q;
  });
}
